name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated workflow is up to date
        run: python3 scripts/build.py --check
      - name: Benchmarks are valid
        run: python3 scripts/benchmark.py
      - name: Tests
        run: python3 -m unittest discover -s tests -v
